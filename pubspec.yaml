name: naap
description: "Naap — privacy-first on-device body measurement and digital parchi for tailors."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Camera capture
  camera: ^0.11.0

  # On-device ML (Google ML Kit — runs fully offline on the phone)
  google_mlkit_pose_detection: ^0.14.0
  google_mlkit_selfie_segmentation: ^0.10.0

  # Image decoding (to get pixel dimensions / mask math)
  image: ^4.2.0

  # Digital Parchi (PDF) + sharing
  pdf: ^3.11.1
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

  # State + persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.0

  # Shop (Phase 1.5) backend client
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B4D3E"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
