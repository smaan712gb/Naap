# Codemagic CI — signed iOS builds + TestFlight distribution.
#
# One-time setup (see docs/TESTFLIGHT.md for the step-by-step):
#   1. Apple Developer Program membership ($99/yr).
#   2. In App Store Connect, create the app with bundle id com.naap.naap.
#   3. In Codemagic: connect the GitHub repo, then under
#      Teams > Integrations add the App Store Connect API key and name it
#      "naap-asc" (or change app_store_connect.auth below).
#   4. First build uploads to TestFlight; add family testers to the
#      "Family" internal group in App Store Connect.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: naap-asc
    environment:
      flutter: stable
      xcode: latest
      # Manual signing: the cert + profile are created by
      # scripts/make_ios_signing.py and uploaded once under
      # Codemagic > Personal Account > Code signing identities with these
      # exact reference names. (Codemagic's automatic signing failed to
      # create them itself — "No matching profiles found", 2026-09-02.)
      ios_signing:
        certificates:
          - naap_dist_cert
        provisioning_profiles:
          - naap_appstore_profile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'lib/**'
          - 'ios/**'
          - 'android/**'
          - 'assets/**'
          - 'test/**'
          - 'pubspec.yaml'
          - 'pubspec.lock'
          - 'codemagic.yaml'
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Unit tests
        script: flutter test
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build signed ipa
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. The "Family" internal group has automatic
        # distribution enabled in App Store Connect, so every processed
        # build reaches the household with no beta review. Turn
        # submit_to_testflight/beta_groups back on only for EXTERNAL
        # groups — and fill in the TestFlight test-info page first
        # (appstoreconnect.apple.com/apps/6807809674/testflight/test-info),
        # or the review submission fails.

  android-apk:
    name: Android release APK
    max_build_duration: 45
    # mac_mini_m2 is the only instance type on the free personal plan
    # (linux_x2 fails with a billing-plan error).
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'lib/**'
          - 'android/**'
          - 'assets/**'
          - 'test/**'
          - 'pubspec.yaml'
          - 'pubspec.lock'
          - 'codemagic.yaml'
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Unit tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      # Android testers get the APK download link by email on every push —
      # add family addresses here as they join.
      email:
        recipients:
          - smaan2011@gmail.com
          - imrankhantrs@gmail.com  # Imran Khan — tailor tester, Pakistan
